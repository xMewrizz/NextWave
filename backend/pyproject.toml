[project]
name = "radar-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.121", "uvicorn[standard]>=0.40"]

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.4", "pytest-asyncio>=1.2", "ruff>=0.14"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
