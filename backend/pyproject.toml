[project]
name = "radar-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.121",
    "nextwave-tech-radar",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.40",
]

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.4", "pytest-asyncio>=1.2", "ruff>=0.14"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.json"]

[tool.uv.sources]
nextwave-tech-radar = { path = "..", editable = true }
