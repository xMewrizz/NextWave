[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nextwave-tech-radar"
version = "0.1.0"
description = "Evidence-backed detection of emerging technology trends"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openpyxl>=3.1,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
