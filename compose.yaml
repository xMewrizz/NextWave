name: nextwave

services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./config/hackathon.env
    environment:
      NEXTWAVE_RESULT_DIR: /data/result
    volumes:
      - ${NEXTWAVE_RESULT_DIR:-./data/development/analysis-result-aiinfra-004-v1}:/data/result:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/result/current', timeout=2)
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_ORIGIN: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
