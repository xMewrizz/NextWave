name: ci

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package
        run: python -m pip install -e . ruff

      - name: Lint root package
        run: ruff check src tests

      - name: Run contract tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python files
        run: python -m compileall -q src tests

      - name: Check package entry point
        run: python -m nextwave --version

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nextwave
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: nextwave_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nextwave -d nextwave_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend and test dependencies
        run: python -m pip install -e . ./backend httpx pytest pytest-asyncio ruff

      - name: Lint backend
        run: ruff check backend/app backend/test_api.py

      - name: Run backend tests (SQLite)
        run: python -m pytest backend/test_api.py -q

      - name: Run backend tests (PostgreSQL)
        env:
          NEXTWAVE_TEST_DATABASE_URL: postgresql+psycopg://nextwave:test-only@localhost:5432/nextwave_test
        run: python -m pytest backend/test_api.py -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
